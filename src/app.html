<!doctype html>
<html
	lang="%sveltekit.html.lang%"
	dir="%sveltekit.html.dir%"
	class="dark"
	style="background-color: #030712; color: #f3f4f6; color-scheme: dark"
>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script src="https://accounts.google.com/gsi/client" async defer></script>
		<script>
			addEventListener('error', function (e) {
				var t = e.target;
				if (!t || !t.tagName) return;
				var u = t.href || t.src || '';
				if (u.indexOf('/_app/') === -1) return;
				try {
					if (sessionStorage.getItem('asset-reload')) return;
					sessionStorage.setItem('asset-reload', '1');
				} catch (_) { return; }
				location.reload();
			}, true);
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover" style="background-color: #030712; color: #f3f4f6">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- עורך הכיתובים של הרשת (סופר-אדמין): סקריפט אחד משותף מה-API, בלי קוד באתר (community-backend/public/site-editor.js) -->
		<script defer src="https://api.gofreeil.com/site-editor.js" data-site="index"></script>
	</body>
</html>
